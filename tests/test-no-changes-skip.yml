name: Test if-no-commit skip behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: "*.nonexistent"
          message: "test: no changes commit"
          if-no-commit: "skip"
          auto-stage: "false"
          update-local: "false"

      - name: Assert action ran (skipped gracefully or failed on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit: $COMMIT"
          if [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded (no commit needed, skipped as expected)"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable or no files matched)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
