name: Test nonexistent message-file fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          message-file: /tmp/this-file-does-not-exist-12345.txt
          files: |
            README.md
          no-retry: 'true'
      - name: Assert action failed on missing message file
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for nonexistent message-file"
            exit 1
          fi
          echo "PASS"
