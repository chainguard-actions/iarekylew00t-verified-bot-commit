name: Test invalid repository format fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: not-a-valid-repo
          message: 'test commit'
          files: |
            README.md
          no-retry: 'true'
      - name: Assert action failed on invalid repository
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT: ${{ steps.action.outputs.commit }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for repository without owner/name"
            exit 1
          fi
          if [ -n "$COMMIT" ]; then
            echo "FAIL: commit output should be empty"
            exit 1
          fi
          echo "PASS"
