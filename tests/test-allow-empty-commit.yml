name: Test allow-empty-commit input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/main
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          repository: octocat/Hello-World
          ref: refs/heads/main
          files: |
            **
          message: "test: empty commit"
          allow-empty-commit: "true"
          token: invalid-token-for-testing
          no-retry: "true"
          no-throttle: "true"
          max-retries: "0"

      - name: Assert action failed at API level (expected without valid token)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail (API call requires valid token), got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed at API level as expected without valid credentials"
