name: Test allow-empty-commit behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: "*.nonexistent"
          message: "test: empty commit"
          allow-empty-commit: "true"
          auto-stage: "false"
          update-local: "false"

      - name: Assert action ran (commit created or failed gracefully on sentinel repo)
        env:
          OUTCOME: ${{ steps.action.outcome }}
          COMMIT: ${{ steps.action.outputs.commit }}
          TREE: ${{ steps.action.outputs.tree }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit: $COMMIT"
          echo "tree: $TREE"
          if [ "$OUTCOME" = "success" ]; then
            if [ -z "$COMMIT" ]; then
              echo "FAIL: action succeeded but commit output is empty"
              exit 1
            fi
            echo "PASS: got commit SHA '$COMMIT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
