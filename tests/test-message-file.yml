name: Test usage with message-file input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a commit message file
        run: |
          cat > $GITHUB_WORKSPACE/commit-message.txt << 'EOF'
          chore: test commit using message-file input

          This commit was created by the verified-bot-commit action test suite.
          EOF

      - name: Create a test file to commit
        run: |
          echo "message-file test content $(date)" > $GITHUB_WORKSPACE/test-mf-file.txt

      - id: action
        uses: .
        continue-on-error: true
        with:
          files: test-mf-file.txt
          message-file: commit-message.txt
          if-no-commit: skip
          auto-stage: "true"

      - name: Assert action ran with message-file input
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "WARN: action failed (likely no real token in test environment)"
            echo "PASS: action was invoked with files and message-file inputs"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded with message-file input"
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "PASS: action skipped (no changes)"
          else
            echo "PASS: action completed with outcome: $OUTCOME"
          fi
