name: Test no-changes behavior with if-no-commit and allow-empty-commit
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action with no staged changes and warning behavior
        id: action
        uses: .
        continue-on-error: true
        with:
          files: "*.nonexistent-extension-xyz"
          message: "chore: empty commit test"
          if-no-commit: warning
          allow-empty-commit: "false"
          auto-stage: "true"
          token: ${{ github.token }}

      - name: Assert action ran (no-changes warning path)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # The action may fail due to API limitations in act environment,
          # but it should not fail due to missing required inputs.
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action ran with no-changes inputs (outcome: ${{ steps.action.outcome }})"
