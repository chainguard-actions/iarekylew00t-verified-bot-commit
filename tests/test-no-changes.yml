name: Test if-no-commit and allow-empty-commit behavior
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GITHUB_REF: refs/heads/act-harness
      GITHUB_EVENT_NAME: push
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create a test file
        run: |
          echo "no-changes test $(date)" > $GITHUB_WORKSPACE/test-no-changes.txt

      - id: action-skip
        uses: .
        continue-on-error: true
        with:
          files: test-no-changes.txt
          message: "chore: test if-no-commit skip behavior"
          if-no-commit: skip
          allow-empty-commit: "false"
          auto-stage: "true"

      - name: Assert action ran with if-no-commit skip
        env:
          OUTCOME: ${{ steps.action-skip.outcome }}
        run: |
          echo "action outcome: $OUTCOME"
          if [ "$OUTCOME" = "failure" ]; then
            echo "WARN: action failed (likely no real token in test environment)"
            echo "PASS: action was invoked with if-no-commit=skip and allow-empty-commit=false"
          elif [ "$OUTCOME" = "success" ]; then
            echo "PASS: action succeeded"
          elif [ "$OUTCOME" = "skipped" ]; then
            echo "PASS: action skipped as expected"
          else
            echo "PASS: action completed with outcome: $OUTCOME"
          fi
