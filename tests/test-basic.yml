name: Test basic commit (sentinel repo)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a commit message file and a changed file
        run: |
          echo "chore: test verified bot commit" > /tmp/commit-msg.txt
          mkdir -p act-test-output
          echo "hello $(date +%s)" > act-test-output/hello.txt
      - id: action
        uses: .
        continue-on-error: true
        with:
          message-file: /tmp/commit-msg.txt
          files: |
            act-test-output/*.txt
          update-local: 'false'
          no-retry: 'true'
      - name: Assert action ran (commit created, or failed gracefully on the sentinel repo)
        env:
          RESULT: ${{ steps.action.outputs.commit }}
          REF: ${{ steps.action.outputs.ref }}
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          echo "commit: $RESULT"
          echo "ref: $REF"
          if [ "$OUTCOME" = "success" ]; then
            if ! echo "$RESULT" | grep -qE '^[0-9a-f]{40}$'; then
              echo "FAIL: action succeeded but commit output is not a SHA"
              exit 1
            fi
            if [ "$REF" != "$RESULT" ]; then
              echo "FAIL: ref output should equal commit SHA"
              exit 1
            fi
            echo "PASS: got commit '$RESULT'"
          elif [ "$OUTCOME" = "failure" ]; then
            echo "PASS: action failed gracefully (sentinel repo is not resolvable)"
          else
            echo "FAIL: unexpected outcome '$OUTCOME'"
            exit 1
          fi
